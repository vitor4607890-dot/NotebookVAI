<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projeto Notebook 💻</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d0d18;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            background: #18182a;
            padding: 25px;
            border-radius: 20px;
        }

        h1 {
            margin-top: 0;
        }

        .valor {
            font-size: 30px;
            font-weight: bold;
            margin: 15px 0;
        }

        .info {
            margin: 12px 0;
            color: #ccc;
        }

        .barra-fundo {
            width: 100%;
            height: 18px;
            background: #303044;
            border-radius: 20px;
            overflow: hidden;
            margin: 20px 0 10px;
        }

        .barra {
            height: 100%;
            width: 0%;
            background: #a970ff;
            transition: width 0.3s;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #8d52e8;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .aviso {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #292044;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💻 Projeto Notebook</h1>

        <div class="info">
            💰 Guardado
        </div>

        <div class="valor" id="guardado">
            R$ 0,00
        </div>

        <div class="info">
            🎯 Meta: R$ 3.000,00
        </div>

        <div class="info">
            💸 Falta: <strong id="falta">R$ 3.000,00</strong>
        </div>

        <div class="barra-fundo">
            <div class="barra" id="barra"></div>
        </div>

        <div id="porcentagem">
            0%
        </div>

        <input
            type="number"
            id="entrada"
            placeholder="Quanto você ganhou?"
            min="0"
            step="0.01"
        >

        <button onclick="adicionar()">
            ➕ Adicionar
        </button>

        <div class="aviso" id="aviso">
            🎉💻 <strong>VOCÊ CHEGOU EM R$1.500!</strong>
            <br><br>
            A meta do notebook foi alcançada! 🚀
        </div>

    </div>

    <script>

        const META = 3000;
        const META_NOTEBOOK = 1500;

        let guardado =
            Number(localStorage.getItem("projetoNotebook")) || 0;


        function dinheiro(valor) {

            return valor.toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });

        }


        function atualizar() {

            document.getElementById("guardado").textContent =
                dinheiro(guardado);

            let falta = Math.max(META - guardado, 0);

            document.getElementById("falta").textContent =
                dinheiro(falta);

            let porcentagem =
                Math.min((guardado / META) * 100, 100);

            document.getElementById("porcentagem").textContent =
                porcentagem.toFixed(1).replace(".", ",") + "%";

            document.getElementById("barra").style.width =
                porcentagem + "%";


            if (guardado >= META_NOTEBOOK) {

                document.getElementById("aviso").style.display =
                    "block";

            } else {

                document.getElementById("aviso").style.display =
                    "none";

            }


            localStorage.setItem(
                "projetoNotebook",
                guardado
            );

        }


        function adicionar() {

            let entrada =
                Number(document.getElementById("entrada").value);

            if (entrada <= 0 || isNaN(entrada)) {

                alert("Digite um valor válido.");

                return;

            }

            guardado += entrada;

            document.getElementById("entrada").value = "";

            atualizar();

        }


        atualizar();

    </script>

</body>
</html>
